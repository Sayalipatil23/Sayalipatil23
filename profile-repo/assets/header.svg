<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="320" viewBox="0 0 1000 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f0c29"><animate attributeName="stop-color" values="#0f0c29;#1b1464;#0f0c29" dur="8s" repeatCount="indefinite"/></stop>
      <stop offset="55%" stop-color="#302b63"/>
      <stop offset="100%" stop-color="#24243e"><animate attributeName="stop-color" values="#24243e;#0b5563;#24243e" dur="8s" repeatCount="indefinite"/></stop>
    </linearGradient>
    <linearGradient id="txt" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00f5ff"><animate attributeName="stop-color" values="#00f5ff;#a855f7;#00f5ff" dur="5s" repeatCount="indefinite"/></stop>
      <stop offset="100%" stop-color="#a855f7"><animate attributeName="stop-color" values="#a855f7;#00f5ff;#a855f7" dur="5s" repeatCount="indefinite"/></stop>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="3.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <clipPath id="round"><rect width="1000" height="320" rx="18"/></clipPath>
  </defs>
  <g clip-path="url(#round)">
    <rect width="1000" height="320" fill="url(#bg)"/>

    <!-- twinkling stars -->
    <g fill="#fff">
      <circle cx="60" cy="40" r="1.5"><animate attributeName="opacity" values="0;1;0" dur="2.2s" repeatCount="indefinite"/></circle>
      <circle cx="170" cy="90" r="1.2"><animate attributeName="opacity" values="1;0;1" dur="3s" repeatCount="indefinite"/></circle>
      <circle cx="320" cy="30" r="1.8"><animate attributeName="opacity" values="0;1;0" dur="2.6s" repeatCount="indefinite"/></circle>
      <circle cx="430" cy="70" r="1.2"><animate attributeName="opacity" values="1;0;1" dur="1.9s" repeatCount="indefinite"/></circle>
      <circle cx="620" cy="35" r="1.6"><animate attributeName="opacity" values="0;1;0" dur="3.3s" repeatCount="indefinite"/></circle>
      <circle cx="760" cy="80" r="1.3"><animate attributeName="opacity" values="1;0;1" dur="2.4s" repeatCount="indefinite"/></circle>
      <circle cx="900" cy="35" r="1.8"><animate attributeName="opacity" values="0;1;0" dur="2.8s" repeatCount="indefinite"/></circle>
      <circle cx="950" cy="120" r="1.2"><animate attributeName="opacity" values="1;0;1" dur="2s" repeatCount="indefinite"/></circle>
    </g>

    <!-- rotating rings -->
    <g transform="translate(500,150)" fill="none">
      <circle r="125" stroke="#a855f7" stroke-opacity=".3" stroke-width="2" stroke-dasharray="6 14">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="30s" repeatCount="indefinite"/></circle>
      <circle r="150" stroke="#00f5ff" stroke-opacity=".25" stroke-width="2" stroke-dasharray="2 10">
        <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="40s" repeatCount="indefinite"/></circle>
    </g>

    <!-- orbiting tech chips -->
    <g font-family="Consolas, monospace" font-size="13" font-weight="700" text-anchor="middle">
      <g transform="translate(500,150)">
        <animateTransform attributeName="transform" type="rotate" from="0 500 150" to="360 500 150" dur="24s" repeatCount="indefinite" additive="replace"/>
      </g>
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0 500 150" to="360 500 150" dur="24s" repeatCount="indefinite"/>
        <g transform="translate(500,25)"><rect x="-38" y="-14" width="76" height="26" rx="13" fill="#FA4616"/><text y="4" fill="#fff"><animateTransform attributeName="transform" type="rotate" from="360 0 0" to="0 0 0" dur="24s" repeatCount="indefinite"/>UiPath</text></g>
        <g transform="translate(650,150)"><rect x="-34" y="-14" width="68" height="26" rx="13" fill="#3776AB"/><text y="4" fill="#fff"><animateTransform attributeName="transform" type="rotate" from="270 0 0" to="-90 0 0" dur="24s" repeatCount="indefinite"/>Python</text></g>
        <g transform="translate(500,275)"><rect x="-32" y="-14" width="64" height="26" rx="13" fill="#a855f7"/><text y="4" fill="#fff"><animateTransform attributeName="transform" type="rotate" from="180 0 0" to="-180 0 0" dur="24s" repeatCount="indefinite"/>GenAI</text></g>
        <g transform="translate(350,150)"><rect x="-26" y="-14" width="52" height="26" rx="13" fill="#0e75b6"/><text y="4" fill="#fff"><animateTransform attributeName="transform" type="rotate" from="90 0 0" to="-270 0 0" dur="24s" repeatCount="indefinite"/>SQL</text></g>
      </g>
    </g>

    <!-- name -->
    <text x="500" y="145" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="64" font-weight="800" fill="url(#txt)" filter="url(#glow)">Sayali Patil
      <animate attributeName="opacity" values="0;1" dur="1.5s" fill="freeze"/></text>
    <text x="500" y="185" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="20" fill="#e5e7eb" letter-spacing="4">RPA ANALYST  •  AGENTIC AUTOMATION  •  GENAI
      <animate attributeName="opacity" values="0;0;1" keyTimes="0;.4;1" dur="2.5s" fill="freeze"/></text>
    <text x="500" y="222" text-anchor="middle" font-family="Consolas, monospace" font-size="15" fill="#00f5ff">&gt; automating the future, one workflow at a time_
      <animate attributeName="opacity" values="1;.3;1" dur="2s" repeatCount="indefinite"/></text>

    <!-- waves -->
    <g>
      <path d="M0 270 Q125 240 250 270 T500 270 T750 270 T1000 270 T1250 270 T1500 270 T1750 270 T2000 270 V320 H0Z" fill="#00f5ff" fill-opacity=".18">
        <animateTransform attributeName="transform" type="translate" from="0 0" to="-1000 0" dur="12s" repeatCount="indefinite"/></path>
      <path d="M0 285 Q125 260 250 285 T500 285 T750 285 T1000 285 T1250 285 T1500 285 T1750 285 T2000 285 V320 H0Z" fill="#a855f7" fill-opacity=".3">
        <animateTransform attributeName="transform" type="translate" from="-1000 0" to="0 0" dur="9s" repeatCount="indefinite"/></path>
    </g>
  </g>
</svg>
