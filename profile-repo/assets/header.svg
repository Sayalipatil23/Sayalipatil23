<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="320" viewBox="0 0 1000 320" role="img" aria-label="Sayali Patil - RPA Analyst">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0f1f"/>
      <stop offset=".55" stop-color="#101935"/>
      <stop offset="1" stop-color="#0b1a2c"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#8be9ff"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset=".5" stop-color="#fff" stop-opacity=".9"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="orbA"><stop offset="0" stop-color="#22d3ee" stop-opacity=".28"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></radialGradient>
    <radialGradient id="orbB"><stop offset="0" stop-color="#8b5cf6" stop-opacity=".30"/><stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/></radialGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1" fill="#fff" fill-opacity=".07"/></pattern>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <clipPath id="frame"><rect width="1000" height="320" rx="18"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <!-- background -->
    <rect width="1000" height="320" fill="url(#bg)"/>
    <rect width="1000" height="320" fill="url(#dots)"/>
    <circle r="220" fill="url(#orbA)"><animate attributeName="cx" values="120;190;120" dur="14s" repeatCount="indefinite"/><animate attributeName="cy" values="40;90;40" dur="14s" repeatCount="indefinite"/></circle>
    <circle r="240" fill="url(#orbB)"><animate attributeName="cx" values="900;830;900" dur="16s" repeatCount="indefinite"/><animate attributeName="cy" values="300;250;300" dur="16s" repeatCount="indefinite"/></circle>

    <!-- LEFT: identity -->
    <g font-family="'Segoe UI', Helvetica, Arial, sans-serif">
      <g>
        <animate attributeName="opacity" values="0;0;1" keyTimes="0;.05;1" dur="1s" fill="freeze"/>
        <rect x="60" y="62" width="26" height="3" rx="1.5" fill="url(#accent)"/>
        <text x="96" y="68" font-size="13" font-weight="600" letter-spacing="3.5" fill="#67e8f9">HELLO, I'M</text>
      </g>

      <text x="58" y="136" font-size="62" font-weight="800" letter-spacing="-1" fill="url(#name)">Sayali Patil
        <animate attributeName="opacity" values="0;0;1" keyTimes="0;.2;1" dur="1.4s" fill="freeze"/>
      </text>

      <rect x="60" y="152" width="0" height="4" rx="2" fill="url(#accent)">
        <animate attributeName="width" values="0;0;150" keyTimes="0;.3;1" dur="1.6s" fill="freeze"/>
      </rect>

      <text x="60" y="190" font-size="22" font-weight="600" fill="#e2e8f0">RPA Analyst
        <tspan fill="#64748b" font-weight="400">  |  </tspan><tspan fill="#cbd5e1" font-weight="400">Driving Intelligent Automation</tspan>
        <animate attributeName="opacity" values="0;0;1" keyTimes="0;.4;1" dur="1.8s" fill="freeze"/>
      </text>
      <text x="60" y="216" font-size="14.5" fill="#8fa3c7">Agentic automation  ·  LLM workflows  ·  Data-driven bots
        <animate attributeName="opacity" values="0;0;1" keyTimes="0;.5;1" dur="2s" fill="freeze"/>
      </text>

      <!-- pills -->
      <g font-size="12.5" font-weight="600" text-anchor="middle">
        <animate attributeName="opacity" values="0;0;1" keyTimes="0;.6;1" dur="2.2s" fill="freeze"/>
        <rect x="60" y="238" width="116" height="30" rx="15" fill="#fa4616" fill-opacity=".14" stroke="#fa4616" stroke-opacity=".55"/>
        <text x="118" y="258" fill="#ff8a65">UiPath ADA</text>
        <rect x="188" y="238" width="166" height="30" rx="15" fill="#22d3ee" fill-opacity=".10" stroke="#22d3ee" stroke-opacity=".5"/>
        <text x="271" y="258" fill="#67e8f9">Agentic Automation</text>
        <rect x="366" y="238" width="172" height="30" rx="15" fill="#8b5cf6" fill-opacity=".14" stroke="#8b5cf6" stroke-opacity=".55"/>
        <text x="452" y="258" fill="#c4b5fd">Python · SQL · GenAI</text>
      </g>
    </g>

    <!-- RIGHT: automation workflow loop -->
    <g font-family="'Segoe UI', Helvetica, Arial, sans-serif">
      <rect x="590" y="40" width="370" height="240" rx="18" fill="#ffffff" fill-opacity=".035" stroke="#ffffff" stroke-opacity=".10"/>
      <text x="612" y="66" font-size="11" font-weight="600" letter-spacing="2.5" fill="#64748b">AUTOMATION PIPELINE</text>
      <circle cx="935" cy="62" r="4" fill="#34d399"><animate attributeName="opacity" values="1;.25;1" dur="1.8s" repeatCount="indefinite"/></circle>

      <!-- flowing connector loop -->
      <rect x="680" y="125" width="190" height="95" rx="0" fill="none" stroke="#22d3ee" stroke-opacity=".25" stroke-width="2"/>
      <rect x="680" y="125" width="190" height="95" fill="none" stroke="url(#accent)" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="6 10">
        <animate attributeName="stroke-dashoffset" from="0" to="-64" dur="2.4s" repeatCount="indefinite"/>
      </rect>

      <!-- travelling packet -->
      <circle r="5" fill="#fff" filter="url(#soft)">
        <animateMotion dur="6s" repeatCount="indefinite" path="M680,125 H870 V220 H680 Z"/>
      </circle>

      <!-- node: Trigger -->
      <g transform="translate(680,125)">
        <circle r="27" fill="#0f172a" stroke="#fbbf24" stroke-width="2"/>
        <circle r="27" fill="none" stroke="#fbbf24" stroke-opacity=".5"><animate attributeName="r" values="27;38;27" dur="3s" repeatCount="indefinite"/><animate attributeName="stroke-opacity" values=".5;0;.5" dur="3s" repeatCount="indefinite"/></circle>
        <path d="M-3,-13 L-10,2 H-1 L-4,13 L10,-4 H1 L5,-13Z" fill="#fbbf24"/>
        <text y="-40" text-anchor="middle" font-size="12" font-weight="600" fill="#cbd5e1">Trigger</text>
      </g>
      <!-- node: RPA Bot -->
      <g transform="translate(870,125)">
        <circle r="27" fill="#0f172a" stroke="#22d3ee" stroke-width="2"/>
        <g><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="10s" repeatCount="indefinite"/>
          <circle r="12" fill="none" stroke="#22d3ee" stroke-width="4.5" stroke-dasharray="4.7 4.7"/>
          <circle r="8" fill="#0f172a" stroke="#22d3ee" stroke-width="2"/>
        </g>
        <circle r="3" fill="#22d3ee"/>
        <text y="-40" text-anchor="middle" font-size="12" font-weight="600" fill="#cbd5e1">RPA Bot</text>
      </g>
      <!-- node: LLM Agent -->
      <g transform="translate(870,220)">
        <circle r="27" fill="#0f172a" stroke="#a78bfa" stroke-width="2"/>
        <path d="M0,-13 L3.5,-3.5 L13,0 L3.5,3.5 L0,13 L-3.5,3.5 L-13,0 L-3.5,-3.5Z" fill="#a78bfa">
          <animateTransform attributeName="transform" type="scale" values="1;1.18;1" dur="2.4s" repeatCount="indefinite"/>
        </path>
        <text y="46" text-anchor="middle" font-size="12" font-weight="600" fill="#cbd5e1">LLM Agent</text>
      </g>
      <!-- node: Output -->
      <g transform="translate(680,220)">
        <circle r="27" fill="#0f172a" stroke="#34d399" stroke-width="2"/>
        <path d="M-9,0 L-3,7 L9,-8" fill="none" stroke="#34d399" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
        <text y="46" text-anchor="middle" font-size="12" font-weight="600" fill="#cbd5e1">Output</text>
      </g>
    </g>

    <!-- bottom accent bar with sweep -->
    <rect x="0" y="315" width="1000" height="5" fill="url(#accent)"/>
    <rect y="315" width="260" height="5" fill="url(#sweep)"><animate attributeName="x" values="-260;1000" dur="4.5s" repeatCount="indefinite"/></rect>
  </g>
  <rect x=".5" y=".5" width="999" height="319" rx="18" fill="none" stroke="#ffffff" stroke-opacity=".10"/>
</svg>
